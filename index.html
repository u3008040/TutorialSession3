<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial 3 · The Midterm, Taken Apart</title>
<meta name="description" content="INE 315 Week 10: sensors, conversion functions and try/except, one card at a time.">
<style>
:root{
  --bg:#faf9f7; --panel:#ffffff; --panel-2:#f3f2ef; --ink:#1b1b1a; --ink-2:#3d3d3a; --ink-3:#77766f;
  --line:#e0dfda; --line-soft:#eceae5; --code-bg:#f7f6f3; --com:#8a8880;
  --red:#A93226; --red-soft:rgba(169,50,38,.09); --blue:#2874A6; --blue-soft:rgba(40,116,166,.10);
  --ok:#1e7a4b; --ok-soft:rgba(30,122,75,.10); --bad:#b0382a; --bad-soft:rgba(176,56,42,.09);
  --amber:#c77a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
    --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
    --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
    --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
    --amber:#e0a94a;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
  --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
  --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
  --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
  --amber:#e0a94a;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:86px}
code,pre,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--panel-2); border-radius:5px; padding:1px 5px; font-size:.88em}
kbd{background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:.82em}
b{font-weight:700}
.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.in{max-width:1180px; margin:0 auto; padding:9px 16px; display:flex; gap:12px; align-items:center}
.brand{font-weight:700; font-size:.9rem; white-space:nowrap}
.brand span{color:var(--red)}
.chips{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px; padding:4px 12px;
  font:inherit; font-size:.8rem; white-space:nowrap; cursor:pointer}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.sep{cursor:default; border-style:dashed; color:var(--ink-3); font-weight:700; background:transparent}
.tools{display:flex; gap:8px; align-items:center}
.tbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:8px; padding:4px 10px; font:inherit; font-size:.78rem; cursor:pointer}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; color:var(--ink-3); display:none; cursor:pointer}
.timer.on{display:inline}
.timer.up{color:var(--red)}
main{max-width:1180px; margin:0 auto; padding:22px 16px 0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 28px; animation:in .18s ease-out}
@keyframes in{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.ctype{display:flex; gap:10px; align-items:center; font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:8px}
.pill{border-radius:99px; padding:3px 10px; background:var(--panel-2); color:var(--ink-2)}
.pill.blue{background:var(--blue-soft); color:var(--blue)}
.pill.green{background:var(--ok-soft); color:var(--ok)}
.pill.red{background:var(--red-soft); color:var(--red)}
h1{font-size:clamp(1.7rem,3.6vw,2.3rem); line-height:1.15; margin:.1em 0 .3em}
h2{font-size:clamp(1.25rem,2.6vw,1.7rem); line-height:1.2; margin:.1em 0 .45em}
h3{font-size:1rem; margin:.2em 0 .3em}
p.lead{color:var(--ink-2); margin:.2em 0 1em}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px}
.two.wide-left{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:820px){ .two,.two.wide-left{grid-template-columns:minmax(0,1fr); gap:16px} }
ul.points{margin:.2em 0; padding:0; list-style:none}
ul.points li{position:relative; padding-left:1.7em; margin:.55em 0}
ul.points li::before{counter-increment:p; content:counter(p); position:absolute; left:0; top:.15em; width:1.15em; height:1.15em;
  border-radius:50%; background:var(--red-soft); color:var(--red); font-size:.72em; font-weight:800; display:grid; place-items:center}
ul.points{counter-reset:p}
.notebox{margin-top:14px; background:var(--panel-2); border-radius:12px; padding:11px 15px; font-size:.93rem}
.tag{font-size:.66rem; font-weight:800; letter-spacing:.08em; border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:middle;
  background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}
.tag.PYTHON{background:var(--red-soft); color:var(--red); border-color:var(--red)}
.tag.IDEA{background:var(--blue-soft); color:var(--blue); border-color:var(--blue)}
.tag.GIVEN{background:var(--panel-2); color:var(--ink-3); border-color:var(--line)}
pre.code{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:13px; padding:12px 0; font-size:.9rem; line-height:1.65; overflow-x:auto}
pre.code.big{font-size:.95rem}
.ln{display:block; padding:0 16px 0 0; white-space:pre}
.ln .no{display:inline-block; width:2.4em; padding-right:.9em; text-align:right; color:var(--ink-3); opacity:.6; user-select:none}
.ln.click{cursor:pointer}
.ln.click:hover{background:var(--panel-2)}
.ln.cur{background:var(--blue-soft)}
.ln.right{background:var(--ok-soft)} .ln.wrong{background:var(--bad-soft)}
.tk-kw{color:var(--red); font-weight:700} .tk-str{color:var(--blue)} .tk-num{color:var(--amber)}
.tk-com{color:var(--com); font-style:italic} .tk-fn{color:var(--blue)}
.opts{display:grid; gap:9px}
.opt{display:flex; gap:11px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--panel);
  border-radius:12px; padding:10px 13px; font:inherit; cursor:pointer; color:var(--ink)}
.opt:hover{border-color:var(--ink-3)}
.opt .l{font-weight:800; color:var(--ink-3)}
.opt pre{margin:0; font-size:.86rem; white-space:pre-wrap; word-break:break-word}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .l{color:var(--ok)}
.opt.dim{opacity:.45}
.reveal{max-height:0; overflow:hidden; opacity:0; transition:max-height .25s ease,opacity .25s ease}
.reveal.show{max-height:2200px; opacity:1; margin-top:14px}
.cap{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:800; margin:10px 0 5px}
pre.out{margin:0; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:10px 14px;
  font-size:.9rem; white-space:pre; overflow-x:auto; min-height:2.4em}
pre.out.empty{color:var(--ink-3); font-style:italic}
.ask{font-size:.9rem; color:var(--ink-3); margin-top:10px}
.btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 15px; font:inherit; cursor:pointer}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:700}
.btn.blue{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700}
.btn.sm{padding:5px 11px; font-size:.86rem}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.stepinfo{font-size:.85rem; color:var(--ink-3)}
.note{background:var(--panel-2); border-left:3px solid var(--red); border-radius:0 10px 10px 0; padding:10px 14px; font-size:.94rem; min-height:3.2em}
table.vars{width:100%; border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem}
table.vars td{padding:4px 8px; border-bottom:1px dotted var(--line-soft)}
table.vars td:first-child{color:var(--ink-2); width:45%}
table.vars td:last-child{color:var(--red); font-weight:700}
table.vars tr.chg td{background:var(--red-soft)}
.frame{border:1px solid var(--line); border-radius:11px; padding:7px 9px; margin-bottom:9px; background:var(--panel)}
.frame .fh{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:800; margin-bottom:3px}
.pz{display:grid; gap:6px; margin-top:8px; overflow-x:auto}
.pzl{display:flex; gap:10px; align-items:center; min-width:0; border:1px solid var(--line); border-radius:10px; padding:5px 10px; background:var(--panel)}
.pzl.ok{border-color:var(--ok); background:var(--ok-soft)} .pzl.no{border-color:var(--bad); background:var(--bad-soft)}
.pzl .ctl{display:flex; gap:4px}
.pzl .ctl button{width:26px; height:26px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:7px; cursor:pointer; font-size:.8rem}
.pzl .txt{flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem; white-space:pre}
.pzl .mark{font-weight:800; width:1em}
.fb{margin-top:10px; font-size:.95rem}
.errline{margin-top:12px; background:var(--bad-soft); border:1px solid var(--bad); border-radius:11px; padding:10px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem}
.cause{margin-top:12px; background:var(--panel-2); border-radius:12px; padding:12px 15px; font-size:.94rem}
.exp{margin-top:12px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.exp .box{border-radius:11px; padding:8px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.87rem; white-space:pre-wrap}
.exp .want{background:var(--ok-soft); border:1px solid var(--ok)}
.exp .got{background:var(--bad-soft); border:1px solid var(--bad)}
.exp .k{display:block; font-family:inherit; font-size:.66rem; letter-spacing:.07em; text-transform:uppercase; font-weight:800; color:var(--ink-3); margin-bottom:2px}
.cls{display:grid; gap:8px; margin-top:8px}
.clrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:11px; padding:8px 13px; background:var(--panel)}
.clrow.ok{border-color:var(--ok); background:var(--ok-soft)} .clrow.no{border-color:var(--bad); background:var(--bad-soft)}
.clrow .cli{flex:1; min-width:150px}
.clb{display:flex; gap:6px; flex-wrap:wrap}
.binb{font:inherit; font-size:.82rem; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2); border-radius:99px; padding:4px 12px; cursor:pointer}
.binb.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.clrow .mark{font-weight:800; width:1em}
.ftab{width:100%; border-collapse:collapse; font-size:.94rem; margin-top:10px}
.ftab td{padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.ftab{table-layout:fixed}
.ftab td:first-child{width:40%}
.ftab td:last-child{overflow-wrap:anywhere}
.ftab td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue); font-size:.86rem}
.ftab th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:4px 10px; border-bottom:1px solid var(--line)}
.etab,.sum{width:100%; border-collapse:collapse; font-size:.94rem}
.etab th,.sum th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:6px 9px; border-bottom:1px solid var(--line)}
.etab td,.sum td{padding:8px 9px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.etab td:last-child{color:var(--ink-3)}
.sum td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue)}
.sum td{overflow-wrap:anywhere}
.chatbar{display:flex; gap:12px; align-items:center; background:var(--panel-2); border-radius:12px; padding:11px 15px; margin-top:16px; font-size:.93rem}
.exlist{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:6px}
.ex{border:1px solid var(--line); border-radius:12px; padding:11px 15px; background:var(--panel); min-width:0}
.ex .h{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.ex .id{font-weight:800; color:var(--red)}
.ex .kind{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; font-weight:800; border-radius:6px; padding:2px 7px; background:var(--panel-2); color:var(--ink-3)}
.ex .task{margin:6px 0 0; font-size:.94rem; color:var(--ink-2)}
.star{font-size:.72rem; color:var(--amber); font-weight:700}
.session{min-height:58vh; display:flex; flex-direction:column; justify-content:center}
.banner{display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--red); color:#fff; border-radius:99px; padding:4px 14px; margin-bottom:12px}
.banner.s2{background:var(--blue)}
.recap{background:var(--panel-2); border-radius:12px; padding:12px 16px; margin:10px 0 16px; font-size:.95rem}
.demolist{display:grid; gap:8px; margin-top:6px}
.demolist div{border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--panel)}
.rhythm{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:10px; margin-top:18px}
.rh{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--panel)}
.rh .k{font-size:.7rem; font-weight:800; color:var(--red)}
.rh .t{font-weight:700; font-size:.95rem}
.rh .d{font-size:.84rem; color:var(--ink-3)}
.hint{font-size:.83rem; color:var(--ink-3); margin-top:6px}
.tasks{margin:10px 0 0; padding-left:1.2em; font-size:.95rem}
.tasks li{margin:5px 0}
.livecode{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:11px 15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem; white-space:pre-wrap; word-break:break-word; line-height:1.6}
.livecode .res{color:var(--red); font-weight:700}
.livecode .cm{color:var(--com); font-style:italic}
.livecode .on{color:var(--ok); font-weight:700}
/* --- live widgets --- */
.panelbox{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--panel); min-width:0}
.panelbox h4{margin:0 0 8px; font-size:.95rem}
.panelbox.bad{border-color:var(--bad)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 12px}
.push{border:1px solid var(--line); border-radius:12px; padding:9px 14px; font:inherit; font-weight:700; font-size:.86rem;
  background:var(--panel-2); color:var(--ink-2); cursor:pointer; user-select:none}
.push.on{color:#fff}
.push.estop.on{background:var(--red); border-color:var(--red)}
.push.stop.on{background:var(--ink-3); border-color:var(--ink-3)}
.push.start.on{background:var(--ok); border-color:var(--ok)}
.lamp{display:flex; gap:10px; align-items:center; font-weight:700; font-size:.9rem}
.bulb{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--panel-2)}
.bulb.lit{background:var(--amber); border-color:var(--amber); box-shadow:0 0 14px var(--amber)}
.codeline{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.83rem; padding:2px 6px; border-radius:6px; white-space:pre; overflow-x:auto}
#chain,#steps{overflow-x:auto}
.codeline.hit{background:var(--blue-soft)}
.codeline.dead{opacity:.4}
.sl{display:grid; grid-template-columns:6.4em minmax(0,1fr) 4em; gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.sl input[type=range]{width:100%; accent-color:var(--blue)}
.sl b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:right}
.tin{display:grid; grid-template-columns:6.4em minmax(0,1fr); gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.tin input[type=text],.tin input[type=number]{font:inherit; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9rem;
  padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); width:100%}
.console{background:#14141a; color:#e8e7e1; border-radius:12px; padding:10px 13px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.82rem; line-height:1.55; height:210px; overflow-y:auto; border:1px solid var(--line)}
.console .t{color:#8fb7d8} .console .m{color:#e8e7e1} .console .me{color:#f0b429; font-weight:700} .console .sys{color:#8a8880; font-style:italic}
svg.dg{display:block; width:100%; height:auto}
svg.dg .bx{fill:var(--panel-2); stroke:var(--line); stroke-width:1.5}
svg.dg .bx.acc{fill:var(--red-soft); stroke:var(--red)}
svg.dg .bx.b2{fill:var(--blue-soft); stroke:var(--blue)}
svg.dg .tx{fill:var(--ink); font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .sm{fill:var(--ink-3); font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .ar{stroke:var(--ink-3); stroke-width:1.6; fill:none; marker-end:url(#ah)}
.nav{position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); z-index:20}
.nav .in{justify-content:space-between}
.prog{height:3px; background:var(--red); width:0; transition:width .2s}
.navbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 18px; font:inherit; font-weight:700; cursor:pointer}
.navbtn.next{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.navbtn:disabled{opacity:.35; cursor:not-allowed}
#where{font-size:.82rem; color:var(--ink-3); text-align:center}

/* --- tutorial 2 live widgets --- */
.pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.pick button{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px;
  padding:4px 12px; font:inherit; font-size:.82rem; cursor:pointer}
.pick button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.clsbox{border:1px solid var(--line); border-radius:12px; padding:9px 12px; margin:6px 0; background:var(--panel-2)}
.clsbox.found{border-color:var(--ok); background:var(--ok-soft)}
.clsbox.looked{border-color:var(--blue); background:var(--blue-soft)}
.clsbox .hd{font-weight:700; font-size:.9rem; margin-bottom:3px}
.clsbox .ml{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.8rem; color:var(--ink-3)}
.clsbox .ml b{color:var(--ink)}
.updown{text-align:center; color:var(--ink-3); font-size:.8rem; margin:-2px 0}
.bar{height:16px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); overflow:hidden; margin:8px 0 4px}
.bar span{display:block; height:100%; background:var(--blue); transition:width .18s}
.bar span.full{background:var(--bad)}
.boxes{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:7px; margin-top:8px}
.boxb{border:1px solid var(--line); border-radius:10px; padding:7px 10px; background:var(--panel); font-size:.82rem;
  text-align:left; cursor:pointer; font-family:inherit; color:var(--ink); min-width:0}
.boxb small{display:block; color:var(--ink-3)}
.boxb.on{border-color:var(--ok); background:var(--ok-soft)}
.boxb.no{border-color:var(--bad); background:var(--bad-soft)}
.boxb:disabled{opacity:.45; cursor:default}
.stoprow{display:flex; gap:8px; align-items:center; margin:5px 0; font-size:.88rem}
.stoprow input{accent-color:var(--blue)}
.stoprow .km{margin-left:auto; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--ink-3)}

/* --- tutorial 3: fill and marks cards --- */
pre.code.fillcode{padding:14px 0; line-height:2.15}
input.bk{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem;
  background:var(--panel); color:var(--ink); border:none; border-bottom:2px solid var(--blue);
  border-radius:4px 4px 0 0; padding:2px 6px 5px; margin:0 2px; min-width:3.2em; max-width:100%;
  line-height:1.25}
input.bk:focus{outline:none; background:var(--blue-soft)}
input.bk.good{border-bottom-color:var(--ok); background:var(--ok-soft)}
input.bk.bad{border-bottom-color:var(--bad); background:var(--bad-soft)}
.bn{font-size:.62rem; font-weight:800; color:var(--ink-3); vertical-align:super; margin-left:1px}
.qbox{background:var(--panel-2); border-left:3px solid var(--red); border-radius:0 10px 10px 0;
  padding:11px 15px; margin-bottom:14px; font-size:.95rem}
table.scheme{width:100%; border-collapse:collapse; font-size:.9rem}
table.scheme td{border-bottom:1px solid var(--line-soft); padding:7px 9px; vertical-align:top}
table.scheme td:first-child{width:3.2em; font-weight:800; color:var(--ok); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table.scheme tr.z td:first-child{color:var(--bad)}
.pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.pick button{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px;
  padding:4px 14px; font:inherit; font-size:.85rem; cursor:pointer; font-variant-numeric:tabular-nums}
.pick button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
@media (max-width:700px){ .brand{display:none} .card{padding:18px 15px; border-radius:14px} main{padding:14px 10px 0} }

rite it", "title": "A new column from two old ones", "task": "Create a column <code>errors_per_100<\/code>, the errors divided by the orders, times 100. <b>Name on the left, expression on the right.<\/b>", "star": false}, {"id": "3.2", "kind": "Write it", "title": "A filter with OR", "task": "Create <code>watch<\/code>, keeping only the rows where <code>orders<\/code> is below 120 <b>or<\/b> <code>errors<\/code> is above 8. <b>Each condition in its own brackets, joined with the single character.<\/b>", "star": false}, {"id": "3.3", "kind": "Write it", "title": "Group, aggregate, sort", "task": "One statement giving the <b>mean minutes per picker, highest first<\/b>. Remember that sorting is smallest-first unless you say otherwise.", "star": false}, {"id": "3.4", "kind": "Fill in", "title": "Five plotting blanks", "task": "Draw a chart showing <b>how the <code>minutes<\/code> values are distributed<\/b>, with a title and both axis labels. The word *distributed* names the chart type.", "star": false}, {"id": "3.5", "kind": "Fix it", "title": "Three faults in one function", "task": "This should keep rows with more than 120 orders <b>and<\/b> fewer than 12 errors, give the <b>mean errors per zone, highest first<\/b>, and set a title. It has three faults and none of them raises immediately. <b>Fix all three.<\/b>", "star": false}, {"id": "3.6", "kind": "Write it", "title": "Pick the chart the question asks for", "task": "Draw the chart that answers <b>\"are orders and errors related?\"<\/b>. Two numbers, one point per row. Label both axes.", "star": false}], "2": [{"id": "3.7", "kind": "Fill in", "title": "The variable and the objective", "task": "Shipments are never negative, and the objective is the freight rate of each route times the amount on it. <b>The cost dictionary is keyed by a pair.<\/b>", "star": false}, {"id": "3.8", "kind": "Fill in", "title": "The two constraint rules", "task": "A supplier may send <b>at most<\/b> what it has; a plant must receive <b>exactly<\/b> what it needs. Look at each rule's own parameter to know which dictionary to index.", "star": false}, {"id": "3.9", "kind": "Write it", "title": "Read three numbers out of a solved model", "task": "<code>solved<\/code> is the same model with an optimal solution already in it. Write the three expressions. <b><code>.value<\/code> is an attribute, so it takes no brackets.<\/b>", "star": false}, {"id": "3.10", "kind": "Write it", "title": "A child class that adds one thing", "task": "<code>WeldStation<\/code> remembers a <code>torches<\/code> count as well. <b>Let the parent set up its two attributes first<\/b>, then add the third. Write no other method.", "star": false}, {"id": "3.11", "kind": "Write it", "title": "A rate, and a two-sided flag", "task": "Add a <code>dev<\/code> column, the zone's <code>rate<\/code> minus the supplied <code>target<\/code>. Then build <code>flagged<\/code>, keeping the rows that are further than <code>tol<\/code> from the target <b>in either direction<\/b>.", "star": false}, {"id": "3.12", "kind": "Write it", "title": "The whole report function", "task": "For each plant, total what it costs to supply it, and return the totals <b>highest first<\/b>. One dictionary, one loop, one sum inside it. <b>This is the hardest thing on the paper.<\/b>", "star": true}]}, "blocks": [{"session": 1, "id": "X1", "short": "The paper", "title": "How the paper works", "cards": [{"kind": "idea", "tag": "IDEA", "title": "Six sections, 100 marks, 46 minutes of writing", "points": ["<b>About 70 marks are routine<\/b> — the same shapes as this page, with different data. Do them first and leave none of them blank.", "<b>About 20 marks need one extra step<\/b> of thinking beyond the shape.", "<b>About 10 marks are deliberately hard.<\/b> Nobody is expected to finish every part — if you leave those until last you lose nothing.", "<b>Every blank is marked on its own.<\/b> A wrong blank never costs you the blank next to it, so a half-finished answer is worth writing down."], "fhead": ["section", "marks &middot; minutes"], "formulas": [["A &nbsp;multiple choice", "16 &middot; 6"], ["B &nbsp;pandas and plots", "18 &middot; 9"], ["C &nbsp;transportation model", "18 &middot; 8"], ["D &nbsp;classes and quality", "24 &middot; 12"], ["E &nbsp;debugging", "14 &middot; 6"], ["F &nbsp;reporting", "10 &middot; 5"]], "note": "<b>60 minutes in the room, 46 minutes of writing.<\/b> That 14-minute margin is your whole lookup budget. It buys two or three checks, not one per question."}, {"kind": "table", "title": "What is asked, and what is never asked", "rows": [["Writing one pandas statement that does one thing", "Why a transportation model is formulated that way"], ["Filling a blank in a Pyomo model you can read", "Solving an LP by hand, or the simplex method"], ["Saying what a short piece of code prints", "Control-chart constants, or any quality formula"], ["Choosing the chart that answers the question asked", "Which chart is prettier"], ["Spotting a missing bracket or a wrong operator", "Memorising the pandas documentation"], ["Reading a value out of a solved model", "Running anything — there is no computer"]], "note": "<b>No formula, no theory, no industrial-engineering reasoning is examined.<\/b> If a question looks like it wants an explanation of the <i>method<\/i>, read it again: it wants the Python."}]}, {"session": 1, "id": "X2", "short": "Section A", "title": "Section A — eight shapes, two marks each", "cards": [{"kind": "predict", "question": "Lists. What prints?", "code": "v = [4, 9, 2, 7]\nv.insert(1, 5)\n\nprint(v[2], len(v))", "options": ["9 5", "5 5", "9 4", "2 5"], "explain": "<b>Everything after the insertion point shifts right.<\/b> The list is now <code>[4, 5, 9, 2, 7]<\/code>, so position 2 holds the 9 that used to be at position 1. In the exam the operation may be <code>append<\/code>, <code>pop<\/code> or a negative index — <b>write the list out after each line<\/b> rather than trying to hold it in your head.", "answer": 0, "output": "9 5"}, {"kind": "predict", "question": "Stack and queue in one card. What prints?", "code": "from collections import deque\n\nstack = []\nfor t in [\"T1\", \"T2\", \"T3\"]:\n    stack.append(t)\nstack.pop()\n\nq = deque([\"A\", \"B\"])\nq.appendleft(\"C\")\nq.pop()\n\nprint(stack[-1], list(q))", "options": ["T2 ['A', 'B']", "T2 ['C', 'B']", "T2 ['C', 'A']", "T3 ['C', 'A']"], "explain": "<b>A stack takes from the end; a queue takes from the front.<\/b> <code>pop()<\/code> removed T3, leaving T2 last. On the deque, <code>appendleft<\/code> put C at the front and <code>pop()<\/code> removed from the <i>back<\/i>, taking B. <b><code>pop<\/code> and <code>popleft<\/code> are the whole distinction<\/b> — one word.", "answer": 2, "output": "T2 ['C', 'A']"}, {"kind": "predict", "question": "A priority queue. What prints?", "code": "from queue import PriorityQueue\n\npq = PriorityQueue()\npq.put((3, \"Pick\"))\npq.put((1, \"Scan\"))\npq.put((2, \"Pack\"))\n\npq.get()\nprint(pq.get()[1])", "options": ["Scan", "Pick", "3", "Pack"], "explain": "<b>It comes out in order of the first item of the tuple, not the order you put it in.<\/b> The discarded <code>get()<\/code> took <code>(1, \"Scan\")<\/code>; the next smallest is <code>(2, \"Pack\")<\/code>. The <code>[1]<\/code> then picks the label out of the tuple.", "answer": 3, "output": "Pack"}, {"kind": "predict", "question": "Where does an attribute live? What prints?", "code": "class Belt:\n    speed = 10\n\nclass Fast(Belt):\n    speed = 25\n\nf = Fast()\nprint(f.speed, Belt.speed)\n\nf.speed = 99\nprint(f.speed, Fast.speed)", "options": ["25 10\n99 99", "25 10\n99 25", "25 25\n99 99", "10 10\n99 25"], "explain": "<b>Python looks on the object first, then on its class, then on the parent.<\/b> <code>f<\/code> has nothing of its own at first, so it finds <code>Fast.speed<\/code> — 25 — and never reaches the 10. Assigning <code>f.speed = 99<\/code> writes it <b>onto that one object<\/b>, which leaves the and the exam will ask for highest first."], "code": "df = pd.DataFrame({\n    \"day\":     [\"D1\", \"D1\", \"D2\", \"D2\"],\n    \"zone\":    [\"Z1\", \"Z2\", \"Z1\", \"Z2\"],\n    \"picker\":  [\"Amal\", \"Bilal\", \"Amal\", \"Sara\"],\n    \"orders\":  [140, 110, 160, 130],\n    \"errors\":  [6, 9, 4, 11],\n    \"minutes\": [95, 80, 100, 88],\n})\n\ndf[\"errors_per_100\"] = df[\"errors\"] / df[\"orders\"] * 100\n\nbusy = df[(df[\"zone\"] == \"Z1\") & (df[\"errors\"] > 5)]\n\nslowest = df.groupby(\"picker\")[\"minutes\"].mean().sort_values(ascending=False)"}, {"kind": "predict", "question": "The trap that costs 2 marks every year. What happens?", "code": "df = pd.DataFrame({\n    \"day\":     [\"D1\", \"D1\", \"D2\", \"D2\"],\n    \"zone\":    [\"Z1\", \"Z2\", \"Z1\", \"Z2\"],\n    \"picker\":  [\"Amal\", \"Bilal\", \"Amal\", \"Sara\"],\n    \"orders\":  [140, 110, 160, 130],\n    \"errors\":  [6, 9, 4, 11],\n    \"minutes\": [95, 80, 100, 88],\n})\n\nhits = df[(df[\"orders\"] > 120) and (df[\"errors\"] > 5)]\nprint(hits)", "options": ["an empty DataFrame", "two rows", "the same as using &", "ValueError: The truth value of a Series is ambiguous. Use a.empty, a.bool(), a.item(), a.any() or a.all()."], "explain": "<b><code>and<\/code> asks one true-or-false question; a column is thousands of them.<\/b> Python cannot reduce a whole column to a single yes, so it refuses. <code>&amp;<\/code> compares row by row, which is what you meant. The same holds for <code>|<\/code> instead of <code>or<\/code>, and <code>~<\/code> instead of <code>not<\/code>. <b>Each condition must be in its own brackets<\/b>, because <code>&amp;<\/code> binds tighter than <code>&gt;<\/code>.", "answer": 3, "output": "ValueError: The truth value of a Series is ambiguous. Use a.empty, a.bool(), a.item(), a.any() or a.all()."}, {"kind": "fill", "title": "The five plotting blanks", "minutes": 0, "intro": "This is Section B(d), worth 5 marks, one per blank. The question will name the chart it wants in words — here, <b>whether two numbers move together<\/b>.", "code": "fig, ax = plt.{{1}}()\nax.{{2}}(df[\"orders\"], df[\"errors\"])\nax.{{3}}(\"Errors against orders picked\")\nax.{{4}}(\"Orders\")\nax.{{5}}(\"Errors\")", "blanks": [{"n": 1, "answer": "subplots", "also": [], "reject": {}, "hint": "One call makes both the figure and the axes, and it is plural."}, {"n": 2, "answer": "scatter", "also": ["plot"], "reject": {}, "hint": "Two numbers, one point per row — you are looking for a relationship."}, {"n": 3, "answer": "set_title", "also": [], "reject": {}, "hint": "The heading above the chart."}, {"n": 4, "answer": "set_xlabel", "also": [], "reject": {}, "hint": "The horizontal axis carries the first argument of the chart call."}, {"n": 5, "answer": "set_ylabel", "also": [], "reject": {}, "hint": "The vertical axis."}], "after": "<b>Every one of these is a method, so every one takes brackets.<\/b> The most expensive mistake in this block is <code>ax.set_title = \"...\"<\/code> with an equals sign: it replaces the method with a string, raises nothing at all, and costs the mark.", "filled": "fig, ax = plt.subplots()\nax.scatter(df[\"orders\"], df[\"errors\"])\nax.set_title(\"Errors against orders picked\")\nax.set_xlabel(\"Orders\")\nax.set_ylabel(\"Errors\")"}, {"kind": "table", "title": "Which chart, and the line that draws it", "rows": [["How are 200 values <b>distributed<\/b>? &nbsp; <code>ax.hist(df[\"col\"], bins=8)<\/code>", "pie charts, for almost anything"], ["Is something <b>drifting over time<\/b>? &nbsp; <code>ax.plot(df[\"day\"], df[\"col\"])<\/code>", "3-D effects"], ["<b>Comparing<\/b> a few named things? &nbsp; <code>ax.bar(s.index, s.values)<\/code>", "which colours to use"], ["Are two numbers <b>related<\/b>? &nbsp; <code>ax.scatter(df[\"a\"], df[\"b\"])<\/code>", "how to export the figure"], ["After a <code>groupby<\/code> you have a <b>Series<\/b>: <code>.index<\/code> and <code>.values<\/code>", "styling and themes"], ["<code>fig, ax = plt.subplots()<\/code> — <b>two names on the left<\/b>", ""]], "note": "<b>Read the verb in the question.<\/b> \"distributed\" is a histogram, \"over the last 30 days\" is a line, \"compare the machines\" is a bar, \"related\" is a scatter. The exam scores the chart <i>type<\/i> blank separately from the rest, so getting the verb right is worth a mark on its own."}, {"kind": "marks", "title": "How many of the 4 marks does this earn?", "total": 4, "question": "<b>Write one statement that creates <code>watch<\/code>, containing only the rows where <code>orders<\/code> is below 120 <b>or<\/b> <code>errors<\/code> is above 8.<\/b> [4 marks]", "answer": "watch = df[df[\"orders\"] < 120 or df[\"errors\"] > 8]", "correct": 1, "scheme": [["+1", "the right columns and the right comparisons"], ["+0", "<code>or<\/code> instead of <code>|<\/code> — this is 2 of the 4 marks, and the line does not run"], ["+0", "no brackets around each condition — 1 mark"], ["+0", "assigned to <code>watch<\/code> correctly, but that alone is not a mark"]], "note": "<b>One word costs three marks.<\/b> Written as <code>watch = df[(df[\"orders\"] &lt; 120) | (df[\"errors\"] &gt; 8)]<\/code> it is full marks. This is the single most common way to lose marks in Section B, every year."}]}, {"session": 1, "id": "X4", "short": "Section E", "title": "Section E — four faults and one innocent line", "cards": [{"kind": "error", "title": "Fault 1 — aggregating the wrong way", "code": "df = pd.DataFrame({\n    \"day\":     [\"D1\", \"D1\", \"D2\", \"D2\"],\n    \"zone\":    [\"Z1\", \"Z2\", \"Z1\", \"Z2\"],\n    \"picker\":  [\"Amal\", \"Bilal\", \"Amal\", \"Sara\"],\n    \"orders\":  [140, 110, 160, 130],\n    \"errors\":  [6, 9, 4, 11],\n    \"minutes\": [95, 80, 100, 88],\n})\n\nsummary = df.groupby(\"zone\").mean(\"errors\")\nprint(summary)", "cause": "<b>The column must be chosen before the aggregation, not inside it.<\/b> <code>.mean()<\/code>'s first argument is not a column name, so pandas rejects it. The correct form is <code>df.groupby(\"zone\")[\"errors\"].mean()<\/code> — <b>group by the label, square-bracket the number, then aggregate<\/b>. Section E asks you to rewrite exactly this line.", "etype": "ValueError", "msg": "numeric_only accepts only Boolean values", "line": 10}, {"kind": "bug", "title": "Fault 2 — sorted the wrong way round", "code": "df = pd.DataFrame({\n    \"day\":     [\"D1\", \"D1\", \"D2\", \"D2\"],\n    \"zone\":    [\"Z1\", \"Z2\", \"Z1\", \"Z2\"],\n    \"picker\":  [\"Amal\", \"Bilal\", \"Amal\", \"Sara\"],\n    \"orders\":  [140, 110, 160, 130],\n    \"errors\":  [6, 9, 4, 11],\n    \"minutes\": [95, 80, 100, 88],\n})\n\nsummary = df.groupby(\"picker\")[\"errors\"].sum()\nprint(summary.sort_values(ascending=True).index[0])", "line": 11, "cause": "<b><code>sort_values()<\/code> is smallest first unless you say otherwise.<\/b> The question asked for the <i>highest<\/i>, and the code answered with the lowest — no error, no warning, just the wrong name. <b><code>ascending=False<\/code> is worth 2 of the 3 marks<\/b> on that part of Section E, so write it even if the rest of the line is shaky.", "expected": "Sara", "got": "Bilal"}, {"kind": "error", "title": "Fault 3 — a method turned into a string", "code": "import matplotlib\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nfig, ax = plt.subplots()\nax.set_title = \"Errors by zone\"\nax.set_xlabel(\"Zone\")\n\nax.set_title(\"and now try to use it\")", "cause": "<b><code>set_title<\/code> is a method, so it is <i>called<\/i>, never assigned.<\/b> The assignment quietly replaces the method with a string and nothing complains — until something tries to call it, which may be much later. On the paper it is a two-mark fix: <code>ax.set_title(\"Errors by zone\")<\/code>. <b>If a name is followed by an equals sign where you expected brackets, look twice.<\/b>", "etype": "TypeError", "msg": "'str' object is not callable", "line": 9}, {"kind": "fill", "title": "Fault 4, and the whole function", "intro": "Four faults: an operator, a missing pair of brackets, an unpacking, and a chart. Fill each blank with the corrected fragment.", "code": "def plot_zone_errors(df):\n    busy = df[(df[\"orders\"] > 120) {{1}} (df[\"errors\"] > 8)]\n    rate = busy.groupby(\"zone\")[\"errors\"].{{2}}\n    {{3}} = plt.subplots()\n    ax.{{4}}(rate.index, rate.values)\n    return fig", "blanks": [{"n": 1, "answer": "|", "also": ["or"], "reject": {"or": "Not <code>or<\/code> — a column is not one true-or-false value. Use the single character that works row by row."}, "hint": "Row by row, this one or that one."}, {"n": 2, "answer": "sum()", "also": ["sum"], "reject": {"sum": "Without the brackets you have handed over the method itself, not its answer."}, "hint": "It is a method. Methods take brackets."}, {"n": 3, "answer": "fig, ax", "also": ["fig,ax"], "reject": {}, "hint": "<code>plt.subplots()<\/code> hands back two things, so two names go on the left."}, {"n": 4, "answer": "bar", "also": [], "reject": {}, "hint": "You are comparing a handful of named zones."}], "after": "<b>A pie chart was the original's fourth fault.<\/b> Pie charts make it hard to compare slices of similar size, which is the one thing this chart is for. The examiner is testing whether you can read the <i>purpose<\/i> out of the question and pick the chart that serves it.", "filled": "def plot_zone_errors(df):\n    busy = df[(df[\"orders\"] > 120) | (df[\"errors\"] > 8)]\n    rate = busy.groupby(\"zone\")[\"errors\"].sum()\n    fig, ax = plt.subplots()\n    ax.bar(rate.index, rate.values)\n    return fig"}, {"kind": "idea", "tag": "IDEA", "title": "And the line that is already correct", "points": ["<b>One line in the exam's broken function is right, and students 'fix' it.<\/b> It looks like this:", "<code>heavy = df[(df[\"a\"] &gt; 400) &amp; (df[\"b\"] &lt; 50)]<\/code>", "<b>Both conditions are in their own brackets<\/b>, and they are joined with <code>&amp;<\/code>, which is exactly what pandas needs.", "Changing <code>&amp;<\/code> to <code>and<\/code> breaks it, and scores zero on that part."], "note": "<b>The instruction says how many faults there are. Count them.<\/b> If the question says three coding errors and one chart, and you have found five, one of your five is not a fault. <b>Fixing a correct line is the cheapest way to lose 3 marks on this paper.<\/b>"}]}, {"session": 1, "id": "X5", "short": "Your turn 1", "title": "Your turn — part 1", "cards": [{"kind": "yourturn", "minutes": 20, "notebook": "tutorial3_exam_drill.ipynb", "part": 1, "sub": "In Colab, in <code>tutorial3_exam_drill.ipynb<\/code>. Exercises <b>3.1 to 3.6<\/b> — the pandas statements, the chart, and the three debugging fixes. Each one ends with <code>check(...)<\/code>, which prints <b>PASS<\/b> or a hint naming the likely mistake.", "chat": "Write them <b>by hand on paper first<\/b>, then type them in. That is what the exam asks for, and it is a different skill from typing with autocomplete."}]}, {"session": 2, "id": "X6", "short": "Section C", "title": "Section C — the Pyomo blanks", "cards": [{"kind": "idea", "tag": "PYTHON", "title": "Five blanks, and what each one is", "points": ["<b>The domain<\/b> — what kind of number the variable may take. Shipments are never negative: <code>NonNegativeReals<\/code>.", "<b>The objective body<\/b> — the cost of one route times the amount on it, and the <code>for<\/code> lines underneath already supply <code>i<\/code> and <code>j<\/code>.", "<b>The two right-hand sides<\/b> — supply is indexed by <code>i<\/code>, demand by <code>j<\/code>. Look at the rule's own parameters to know which.", "<b>Reading a number out<\/b> — <code>model.x[i, j].value<\/code>, and <code>.value<\/code> is the part people forget."], "code": "suppliers = [\"S1\", \"S2\", \"S3\"]\nplants    = [\"A1\", \"A2\"]\n\navailable = {\"S1\": 200, \"S2\": 150, \"S3\": 180}\nneeded    = {\"A1\": 260, \"A2\": 210}\nfreight = {\n    (\"S1\", \"A1\"): 5, (\"S1\", \"A2\"): 8,\n    (\"S2\", \"A1\"): 7, (\"S2\", \"A2\"): 4,\n    (\"S3\", \"A1\"): 6, (\"S3\", \"A2\"): 3\n}", "note": "<b>The cost dictionary is keyed by a pair.<\/b> <code>freight[(i, j)]<\/code> — or <code>freight[i, j]<\/code>, which is the same thing. <b><code>freight[i][j]<\/code> is wrong<\/b> and costs half the marks on that blank."}, {"kind": "fill", "title": "Fill the model", "intro": "Three suppliers into two plants. This is Section C, worth 18 marks, and four of these five blanks are routine.", "code": "model.x = Var(model.S, model.A,\n              domain={{1}})\n\nmodel.obj = Objective(\n    expr=sum({{2}}\n             for i in model.S for j in model.A),\n    sense=minimize\n)\n\ndef supply_rule(model, i):\n    return sum(model.x[i, j] for j in model.A) <= {{3}}\n\ndef demand_rule(model, j):\n    return sum({{4}} for i in model.S) == {{5}}", "blanks": [{"n": 1, "answer": "NonNegativeReals", "also": ["NonNegativeIntegers"], "reject": {}, "hint": "You cannot ship a negative number of cases."}, {"n": 2, "answer": "freight[(i, j)] * model.x[i, j]", "also": ["freight[i, j] * model.x[i, j]", "model.x[i, j] * freight[(i, j)]", "model.x[i, j] * freight[i, j]"], "reject": {}, "hint": "Cost of the route, times how much goes on it."}, {"n": 3, "answer": "available[i]", "also": [], "reject": {}, "hint": "The rule's parameter is i, so the right-hand side is indexed by i."}, {"n": 4, "answer": "model.x[i, j]", "also": ["model.x[i,j]"], "reject": {}, "hint": "The same variable, summed over the other index."}, {"n": 5, "answer": "needed[j]", "also": [], "reject": {}, "hint": "This rule's parameter is j."}], "after": "<b>Supply uses <code>&lt;=<\/code>, demand uses <code>==<\/code>.<\/b> A warehouse need not empty itself, but an order must be met exactly. If you can only remember one of the two, remember that the one you may under-use is the supply.", "filled": "model.x = Var(model.S, model.A,\n              domain=NonNegativeReals)\n\nmodel.obj = Objective(\n    expr=sum(freight[(i, j)] * model.x[i, j]\n             for i in model.S for j in model.A),\n    sense=minimize\n)\n\ndef supply_rule(model, i):\n    return sum(model.x[i, j] for j in model.A) <= available[i]\n\ndef demand_rule(model, j):\n    return sum(model.x[i, j] for i in model.S) == needed[j]"}, {"kind": "fill", "title": "Reading numbers out of a solved model", "intro": "Section C's last part, and Section F's blank (2). The model has been solved; these lines just read it.", "code": "# how much went from S1 to A2\nprint(model.x[\"S1\", \"A2\"].{{1}})\n\n# everything S1 sent, to all plants\nprint(sum(model.x[\"S1\", j].{{2}} for j in model.A))\n\n# what S1 never shipped\nprint(available[\"S1\"] - sum(model.x[\"S1\", j].value for j in {{3}}))", "blanks": [{"n": 1, "answer": "value", "also": [], "reject": {}, "hint": "A Pyomo variable is an object; the number lives on one of its attributes."}, {"n": 2, "answer": "value", "also": [], "reject": {}, "hint": "The same attribute, inside a sum."}, {"n": 3, "answer": "model.A", "also": ["plants", "model.A "], "reject": {}, "hint": "Sum across the destinations, which is the set of plants."}], "after": "<b><code>.value<\/code> has no brackets<\/b> — it is an attribute, not a method. <code>value(model.x[\"S1\", \"A2\"])<\/code>, with <code>value<\/code> as a function, is also correct and earns full marks. What earns nothing is <code>model.x[\"S1\", \"A2\"]<\/code> on its own: that is the variable object, and printing it gives you its name.", "filled": "# how much went from S1 to A2\nprint(model.x[\"S1\", \"A2\"].value)\n\n# everything S1 sent, to all plants\nprint(sum(model.x[\"S1\", j].value for j in model.A))\n\n# what S1 never shipped\nprint(available[\"S1\"] - sum(model.x[\"S1\", j].value for j in model.A))"}]}, {"session": 2, "id": "X7", "short": "Section D", "title": "Section D — classes, then quality", "cards": [{"kind": "trace", "title": "A child class, one line at a time", "code": "class Station:\n    def __init__(self, code, capacity):\n        self.code = code\n        self.capacity = capacity\n\n    def hours_needed(self, units):\n        return units / self.capacity\n\n    def __str__(self):\n        return f\"{self.code} ({self.capacity}/h)\"\n\nclass WeldStation(Station):\n    def __init__(self, code, capacity, torches):\n        super().__init__(code, capacity)\n        self.torches = torches\n\n    def __str__(self):\n        return \"Weld \" + super().__str__()\n\nw = WeldStation(\"W4\", 40, 2)\n\nprint(w.hours_needed(120))\nprint(w)", "steps": [{"line": 1, "kind": "line", "note": "A description only. No station exists yet.", "g": {"Station": "class"}, "fn": null, "loc": null, "out": ""}, {"line": 12, "kind": "line", "note": "The child names its parent <b>in the brackets<\/b>. Still only a description.", "g": {"Station": "class", "WeldStation": "class"}, "fn": null, "loc": null, "out": ""}, {"line": 20, "kind": "line", "note": "Building the child runs the <b>child's<\/b> <code>__init__<\/code>, with <code>self<\/code> an <b>empty<\/b> <code>WeldStation<\/code>. Watch it fill up below.", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation()", "code": "'W4'", "capacity": "40", "torches": "2", "__class__": "class"}, "out": ""}, {"line": 14, "kind": "line", "note": "<code>super().__init__(...)<\/code> runs the <b>parent's<\/b> setup first.", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation()", "code": "'W4'", "capacity": "40"}, "out": ""}, {"line": 3, "kind": "line", "note": "The parent writes <code>code<\/code> into <b>the very same object<\/b>.", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation(code='W4')", "code": "'W4'", "capacity": "40"}, "out": ""}, {"line": 4, "kind": "line", "note": "And <code>capacity<\/code>. The parent has finished its part and hands control back.", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation(code='W4', capacity=40)", "code": "'W4'", "capacity": "40"}, "out": ""}, {"line": 4, "kind": "return", "note": "__init__() is finished. Back to the line that called it.", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation(code='W4', capacity=40)", "code": "'W4'", "capacity": "40", "torches": "2", "__class__": "class"}, "out": ""}, {"line": 15, "kind": "line", "note": "Now the child adds the one attribute that is its own. <b>Three attributes, two <code>__init__<\/code> methods, one object.<\/b>", "g": {"Station": "class", "WeldStation": "class"}, "fn": "__init__", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)", "code": "'W4'", "capacity": "40", "torches": "2", "__class__": "class"}, "out": ""}, {"line": 15, "kind": "return", "note": "__init__() is finished. Back to the line that called it.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": null, "loc": null, "out": ""}, {"line": 22, "kind": "line", "note": "<code>hours_needed<\/code> is <b>not written in WeldStation<\/b>, so Python goes up to <code>Station<\/code> and finds it there.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "hours_needed", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)", "units": "120"}, "out": ""}, {"line": 7, "kind": "line", "note": "120 divided by the station's own capacity, 40, giving 3.0.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "hours_needed", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)", "units": "120"}, "out": ""}, {"line": 7, "kind": "return", "note": "hours_needed() gives back <b>3.0<\/b>. Back to the line that called it.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": null, "loc": null, "out": "3.0\n"}, {"line": 23, "kind": "line", "note": "Printing calls the <b>child's<\/b> <code>__str__<\/code>...", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "__str__", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)", "__class__": "class"}, "out": "3.0\n"}, {"line": 18, "kind": "line", "note": "...which puts a word in front and asks the parent for the rest.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "__str__", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)"}, "out": "3.0\n"}, {"line": 10, "kind": "line", "note": "The parent's f-string, using attributes the parent itself wrote in step 5.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "__str__", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)"}, "out": "3.0\n"}, {"line": 10, "kind": "return", "note": "__str__() gives back <b>'W4 (40/h)'<\/b>. Back to the line that called it.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": "__str__", "loc": {"self": "WeldStation(code='W4', capacity=40, torches=2)", "__class__": "class"}, "out": "3.0\n"}, {"line": 18, "kind": "return", "note": "__str__() gives back <b>'Weld W4 (40/h)'<\/b>. Back to the line that called it.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": null, "loc": null, "out": "3.0\nWeld W4 (40/h)\n"}, {"line": null, "kind": "end", "note": "Finished. The output box shows exactly what Python printed.", "g": {"Station": "class", "WeldStation": "class", "w": "WeldStation(code='W4', capacity=40, torches=2)"}, "fn": null, "loc": null, "out": "3.0\nWeld W4 (40/h)\n"}]}, {"kind": "predict", "question": "A counter that belongs to the class, not the object. What prints?", "code": "class Bin:\n    total = 0\n\n    def __init__(self, code):\n        self.code = code\n        Bin.total += 1\n\na = Bin(\"Z1\")\nb = Bin(\"Z2\")\n\nprint(Bin.total, a.total, a.code)", "options": ["2 2 Z1", "2 1 Z1", "1 1 Z1", "2 2 Z2"], "explain": "<b><code>total<\/code> is written on the class, so there is one of it, shared.<\/b> <code>code<\/code> is written on <code>self<\/code>, so there is one per object. <code>a.total<\/code> finds nothing on <code>a<\/code> and goes up to the class, which is why it reads 2. <b>The exam asks which attribute is shared and which belongs to each object — this is that question.<\/b>", "answer": 0, "output": "2 2 Z1"}, {"kind": "fill", "title": "Quality coding — two statements", "intro": "Section D2 gives you a small table and two or three supplied numbers, and asks for one statement at a time. <b>No quality formula is ever required.<\/b>", "code": "# zone_stats has columns: zone, picks, errors.  limit = 0.05 is supplied.\n\nzone_stats[\"rate\"] = zone_stats[\"errors\"] {{1}} zone_stats[\"picks\"]\n\nover = zone_stats[zone_stats[\"rate\"] {{2}} limit]", "blanks": [{"n": 1, "answer": "/", "also": [], "reject": {}, "hint": "A rate is one column divided by another."}, {"n": 2, "answer": ">", "also": [], "reject": {}, "hint": "Keep the rows that are worse than the limit."}], "after": "<b>The pattern never changes:<\/b> name the new column on the left, build it from existing columns on the right; then filter with one <code>df[ ... ]<\/code>. The exam may ask for a <b>difference<\/b> from a target rather than a ratio — same shape, a minus sign instead.", "filled": "# zone_stats has columns: zone, picks, errors.  limit = 0.05 is supplied.\n\nzone_stats[\"rate\"] = zone_stats[\"errors\"] / zone_stats[\"picks\"]\n\nover = zone_stats[zone_stats[\"rate\"] > limit]"}, {"kind": "idea", "tag": "PYTHON", "title": "“Further than the tolerance, in either direction”", "points": ["That phrase means <b>two comparisons, not one<\/b> — above the target by more than <code>tol<\/code>, <b>or<\/b> below it by more than <code>tol<\/code>.", "<b>Two ways to write it, both worth full marks.<\/b> The short one uses the absolute value of the deviation; the long one spells out both sides with <code>|<\/code>.", "A one-sided test answers a different question and earns about half.", "<b>Watch for the word “either” or “above or below”<\/b> in the question — that is the signal."], "code": "# the short way\nflagged = stats[stats[\"dev\"].abs() > tol]\n\n# the long way, identical result\nflagged = stats[(stats[\"xbar\"] > target + tol) |\n                (stats[\"xbar\"] < target - tol)]", "note": "<b>Same bracket discipline as every other filter:<\/b> each comparison in its own brackets, joined with <code>|<\/code>. If you cannot remember <code>.abs()<\/code> under pressure, write the long version — it is worth exactly the same."}, {"kind": "fill", "title": "The quality-chart plotting blanks", "intro": "Four blanks, one mark each. A <b>limit line<\/b> is a horizontal line drawn at a number, and that number may be an expression rather than a plain variable.", "code": "fig, ax = plt.{{1}}()\nax.{{2}}(zone_stats[\"zone\"], zone_stats[\"rate\"])\nax.{{3}}(limit, color=\"red\", linestyle=\"--\")\nax.{{4}}(\"Error rate by zone\")", "blanks": [{"n": 1, "answer": "subplots", "also": [], "reject": {}, "hint": "Plural, and it hands back two things."}, {"n": 2, "answer": "bar", "also": ["barh"], "reject": {}, "hint": "Four named zones, side by side."}, {"n": 3, "answer": "axhline", "also": [], "reject": {}, "hint": "A horizontal line across the whole axes, at a height."}, {"n": 4, "answer": "set_title", "also": [], "reject": {}, "hint": "The heading above the chart, and it takes brackets."}], "after": "<b>The discriminating blank is the limit line.<\/b> In the exam the height may be written as an expression — <code>target + tol<\/code> rather than a variable called <code>ucl<\/code> — and there may be <b>two of them<\/b>, one for each side. <b>Read which numbers the /* ---------------- Python highlighter ---------------- */
const KW=new Set("def class return if elif else for in while and or not True False None import from as pass break continue try except print".split(" "));
const BI=new Set("len range min max sum int float str list dict type enumerate sorted round abs all any zip bool".split(" "));
function hl(line){
  let out=""; const re=/(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g; let m;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="tk-num">${m[3]}</span>`;
    else if(m[4]){ const w=m[4]; out+= KW.has(w)?`<span class="tk-kw">${w}</span>`: BI.has(w)?`<span class="tk-fn">${w}</span>`: w; }
    else out+=esc(m[0]);
  }
  return out;
}
function codeHTML(src,opts={}){
  return `<pre class="code ${opts.big?"big":""}">`+src.split("\n").map((l,i)=>
    `<span class="ln ${opts.click?"click":""}" data-l="${i+1}"><span class="no">${i+1}</span>${hl(l)||" "}</span>`).join("")+`</pre>`;
}

function tick(){ const m=Math.floor(TIMER.left/60), s=TIMER.left%60; $("#timer").textContent=`${m}:${String(s).padStart(2,"0")}${TIMER.paused?" ||":""}`; }
$("#timer").onclick=()=>{ if(TIMER.left>0){ TIMER.paused=!TIMER.paused; tick(); } };

function varsTable(vars,prev){

  return `<table class="vars">`+keys.map(k=>{ const ch=prev&&JSON.stringify(prev[k])!==JSON.stringify(vars[k]);

}

  const T=card.c; let i=-1;
  e.innerHTML=head(card,esc(T.title))+
   `<div class="two"><div>${codeHTML(T.code,{big:true})}
     <div class="row" style="margin-top:10px"><button class="btn sm" id="tb">&larr; Step back</button><button class="btn sm primary" id="tn">Step &rarr;</button><button class="btn sm" id="tr">Restart</button><span class="stepinfo" id="ti"></span></div>
     <p class="stepinfo" style="margin-top:8px">The highlighted line has <b>just run</b>.</p></div>
    <div><div class="note" id="tnote"></div><div class="cap">Variables</div><div id="tvars"></div><div class="cap">Output</div><pre class="out" id="tout"></pre></div></div>`;
  const draw=()=>{
    const S=T.steps, s=S[i], p=S[i-1];

  };
  const step=d=>{ const j=i+d; if(j<-1||j>=T.steps.length) return false; i=j; draw(); return true; };

    <div class="row" style="margin-top:14px"><button class="btn primary" id="pc">Check</button><button class="btn" id="pa">Show the answer</button><button class="btn" id="pr">Reset</button></div><div class="fb" id="pf"></div>
    <p class="stepinfo" style="margin-top:10px">Each <b>&rarr;</b> adds 4 spaces.</p>`;
  const draw=(res)=>{ $("#pz").innerHTML=P.lines.map((l,i)=>`<div class="pzl ${res?(res[i]?"ok":"no"):""}"><div class="ctl"><button data-i="${i}" data-d="-1">&larr;</button><button data-i="${i}" data-d="1">&rarr;</button></div><div class="txt">${"    ".repeat(lv[i])}${hl(l)}</div><span class="mark">${res?(res[i]?"✓":"✗"):""}</span></div>`).join("");
    $("#pz").querySelectorAll("button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; lv[i]=Math.max(0,Math.min(3,lv[i]+ +b.dataset.d)); $("#pf").textContent=""; draw(); }); };
  $("#pc").onclick=()=>{ const res=lv.map((x,i)=>x===P.levels[i]); draw(res); const n=res.filter(x=>x).length;
    $("#pf").innerHTML= n===res.length?"<b style='color:var(--ok)'>All correct.</b> The indentation now says exactly which lines belong to the loop.":`<b style="color:var(--bad)">${res.length-n} line${res.length-n>1?"s":""} not right yet.</b> Ask: which line ending in a colon does this line belong to?`; };
  $("#pa").onclick=()=>{ P.levels.forEach((x,i)=>lv[i]=x); draw(P.levels.map(()=>true)); $("#pf").textContent="The answer."; };
  $("#pr").onclick=()=>{ lv.fill(0); $("#pf").textContent=""; draw(); };
  draw();
};
function clickLine(e,answer,onPick){
  let done=false;
  const pick=l=>{ if(done) return; done=true;
    e.querySelectorAll(".code .ln").forEach(x=>{ const n=+x.dataset.l; if(n===answer) x.classList.add("right"); else if(n===l) x.classList.add("wrong"); }); onPick(l); };
  e.querySelectorAll(".code .ln").forEach(x=>x.onclick=()=>pick(+x.dataset.l));
  return {advance(){ if(!done){ pick(0); return true; } return false; }};
}

    <div><div class="reveal" id="er"><div class="fb" id="ef"></div><div class="cause">${E.cause}</div></div></div></div>`;
  return clickLine(e,E.line,l=>{ $("#ef").innerHTML= l===E.line?`<b style="color:var(--ok)">Yes, line ${E.line}.</b>`: l?`<b style="color:var(--bad)">Python points at line ${E.line}.</b>`:`Python points at <b>line ${E.line}</b>.`; $("#er").classList.add("show"); });
};
R.bug=(e,card)=>{

     <div class="exp"><div class="box want"><span class="k">we wanted</span>${esc(B.expected)}</div><div class="box got"><span class="k">Python printed</span>${esc(B.got)}</div></div></div>
    <div><div class="reveal" id="er"><div class="fb" id="ef"></div><div class="cause">${B.cause}</div></div></div></div>`;

};

      <div class="reveal" id="ro"><div class="cap">Output</div><pre class="out">${esc(D.output)}</pre></div>`:`<p class="hint">${D.hint||"Run it in Colab to see the output."}</p>`}</div>

R.classify=(e,card)=>{
  const C=card.c, pick=C.items.map(()=>-1); let checked=false;
  e.innerHTML=head(card,esc(C.title),C.task)+
   `<div class="cls">${C.items.map((it,i)=>`<div class="clrow" id="cl${i}"><div class="cli"><code>${esc(it)}</code></div>
      <div class="clb">${C.bins.map((b,j)=>`<button class="binb" data-i="${i}" data-j="${j}">${b}</button>`).join("")}</div><span class="mark" id="cm${i}"></span></div>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="ck">Check</button><button class="btn" id="sa">Show the answer</button><button class="btn" id="rs2">Reset</button></div>
    <div class="fb" id="fb"></div><div class="reveal" id="af"><div class="notebox">${C.after}</div></div>`;
  const paint=()=>{ C.items.forEach((_,i)=>{ e.querySelectorAll(`.binb[data-i="${i}"]`).forEach(b=>b.classList.toggle("on",+b.dataset.j===pick[i]));
    const ok=pick[i]===C.answers[i]; $("#cl"+i).classList.toggle("ok",checked&&ok); $("#cl"+i).classList.toggle("no",checked&&pick[i]>=0&&!ok);
    $("#cm"+i).textContent=checked?(ok?"✓":(pick[i]<0?"?":"✗")):""; }); };
  e.querySelectorAll(".binb").forEach(b=>b.onclick=()=>{ pick[+b.dataset.i]=+b.dataset.j; checked=false; $("#fb").textContent=""; paint(); });
  const done=()=>{ checked=true; paint(); const n=C.items.filter((_,i)=>pick[i]===C.answers[i]).length;
    $("#fb").innerHTML= n===C.items.length?`<b style="color:var(--ok)">All ${n} right.</b>`:`<b style="color:var(--bad)">${n} of ${C.items.length} right.</b> Look again at the ones marked &#10007;.`;
    if(n===C.items.length) $("#af").classList.add("show"); };
  $("#ck").onclick=done;
  $("#sa").onclick=()=>{ C.answers.forEach((a,i)=>pick[i]=a); checked=true; paint(); $("#fb").textContent="The answer."; $("#af").classList.add("show"); };
  $("#rs2").onclick=()=>{ pick.fill(-1); checked=false; $("#fb").textContent=""; $("#af").classList.remove("show"); paint(); };
  paint();
  return {advance(){ if(!checked){ done(); return true; } if(!$("#af").classList.contains("show")){ $("#af").classList.add("show"); return true; } return false; }};
};

/* ---------------- fill: a code block with typed blanks ---------------- */
function normAns(s){
  return String(s).trim()
    .replace(/[‘’“”]/g, '"').replace(/'/g, '"')
    .replace(/\s*([(),\[\]*/+=<>|&-])\s*/g, "$1")
    .replace(/\s+/g, " ").toLowerCase();
}
R.fill=(e,card)=>{
  const F=card.c, B=F.blanks, by={}; B.forEach(b=>by[b.n]=b);
  const parts=F.code.split(/\{\{(\d+)\}\}/);
  let html="", ln=1;
  const lineOpen=n=>`<span class="ln"><span class="no">${n}</span>`;
  html+=`<pre class="code fillcode">`;
  html+=lineOpen(ln);
  for(let i=0;i<parts.length;i++){
    if(i%2===0){
      const seg=parts[i].split("\n");
      seg.forEach((s,k)=>{ if(k) { html+=`</span>`; ln++; html+=lineOpen(ln); } html+= hl(s)||""; });
    } else {
      const n=+parts[i], b=by[n];
      html+=`<input class="bk" id="bk${n}" data-n="${n}" size="${Math.max(6,Math.min(30,b.answer.length+2))}" spellcheck="false" autocomplete="off" aria-label="blank ${n}"><span class="bn">${n}</span>`;
    }
  }
  html+=`</span></pre>`;
  e.innerHTML=head(card,esc(F.title),F.intro)+html+
   `<div class="row" style="margin-top:14px"><button class="btn primary" id="fc">Check</button>
     <button class="btn" id="fh">Hint for the first wrong one</button>
     <button class="btn" id="fa">Show the answers</button>
     <button class="btn" id="fr">Clear</button>
     ${F.minutes?`<button class="btn blue" id="ft">Start ${F.minutes}-minute timer</button>`:""}</div>
    <div class="fb" id="ff"></div><div class="reveal" id="fx"><div class="notebox">${F.after||""}</div></div>`;
  const ok=b=>{ const v=normAns($("#bk"+b.n).value); if(!v) return null;
    if(normAns(b.answer)===v) return true;
    if((b.also||[]).some(a=>normAns(a)===v)) return true;
    return false; };
  const paint=(res)=>{ B.forEach(b=>{ const el=$("#bk"+b.n);
    el.classList.toggle("good", res&&res[b.n]===true); el.classList.toggle("bad", res&&res[b.n]===false); }); };
  const score=()=>{ const res={}; B.forEach(b=>res[b.n]=ok(b)); return res; };
  let done=false;
  const check=()=>{ const res=score(); paint(res);
    const n=B.filter(b=>res[b.n]===true).length, blank=B.filter(b=>res[b.n]===null).length;
    $("#ff").innerHTML = n===B.length
      ? `<b style="color:var(--ok)">All ${n} right.</b> That is ${B.length} mark${B.length>1?"s":""} in the exam.`
      : `<b style="color:var(--bad)">${n} of ${B.length} right</b>${blank?`, ${blank} still empty`:""}. Each blank is marked on its own, so fix them one at a time.`;
    if(n===B.length){ $("#fx").classList.add("show"); done=true; }
    return n===B.length; };
  $("#fc").onclick=check;
  $("#fh").onclick=()=>{ const res=score();
    const b=B.find(x=>res[x.n]!==true);
    if(!b){ $("#ff").innerHTML=`<b style="color:var(--ok)">Nothing left to hint at.</b>`; return; }
    const v=normAns($("#bk"+b.n).value);
    let msg=b.hint||"";
    for(const k in (b.reject||{})) if(normAns(k)===v) msg=b.reject[k];
    $("#ff").innerHTML=`<b>Blank ${b.n}:</b> ${msg}`; };
  $("#fa").onclick=()=>{ B.forEach(b=>{ $("#bk"+b.n).value=b.answer; }); paint(score());
    $("#ff").innerHTML="The answers."; $("#fx").classList.add("show"); done=true; };
  $("#fr").onclick=()=>{ B.forEach(b=>{ const el=$("#bk"+b.n); el.value=""; el.className="bk"; });
    $("#ff").textContent=""; $("#fx").classList.remove("show"); };
  if(F.minutes) $("#ft").onclick=()=>startTimer(F.minutes);
  e.querySelectorAll(".bk").forEach((el,i,all)=>{ el.onkeydown=ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); if(i+1<all.length) all[i+1].focus(); else check(); } }; });
  return {advance(){ if(!done){ if(!check()){ $("#fa").click(); } return true; } return false; }};
};

/* ---------------- marks: how many of the N marks does this earn? ---------------- */
R.marks=(e,card)=>{
  const M=card.c; let picked=null, shown=false;
  e.innerHTML=head(card,esc(M.title),"An answer a student actually wrote. <b>Mark it.</b>")+
   `<div class="two wide-left"><div><div class="qbox">${M.question}</div>
     <div class="cap">what the student wrote</div>${codeHTML(M.answer,{big:true})}
     <div class="cap" style="margin-top:12px">how many of the ${M.total} marks?</div>
     <div class="pick" id="mp">${Array.from({length:M.total+1},(_,i)=>`<button data-i="${i}">${i}</button>`).join("")}</div>
     <div class="fb" id="mf"></div></div>
    <div><div class="reveal" id="mx"><div class="cap">the mark scheme</div>
      <table class="scheme">${M.scheme.map(([p,t])=>`<tr class="${p==="+0"?"z":""}"><td>${p}</td><td>${t}</td></tr>`).join("")}</table>
      <div class="notebox" style="margin-top:12px">${M.note}</div></div></div></div>`;
  const show=()=>{ shown=true; $("#mx").classList.add("show");
    e.querySelectorAll("#mp button").forEach(b=>b.classList.toggle("on",+b.dataset.i===M.correct));
    $("#mf").innerHTML = picked===M.correct
      ? `<b style="color:var(--ok)">Yes — ${M.correct} out of ${M.total}.</b>`
      : picked===null ? `<b>It earns ${M.correct} of the ${M.total}.</b>`
      : `<b style="color:var(--bad)">It earns ${M.correct}, not ${picked}.</b>`; };
  e.querySelectorAll("#mp button").forEach(b=>b.onclick=()=>{ if(shown) return;
    picked=+b.dataset.i; e.querySelectorAll("#mp button").forEach(x=>x.classList.toggle("on",x===b)); show(); });
  return {advance(){ if(!shown){ show(); return true; } return false; }};
};
/* ---------------- navigation ---------------- */
const chips=$("#chips");
let ch=`<button class="chip" data-t="welcome"><b>T3</b> Start</button>`;
[1,2].forEach(s=>{ ch+=`<button class="chip sep" data-t="s${s}">&#9656; Part ${s}</button>`;
  DATA.blocks.filter(b=>b.session===s).forEach(b=>ch+=`<button class="chip" data-t="${b.id}">${esc(b.short)}</button>`); });
ch+=`<button class="chip" data-t="summary">Summary</button>`;
chips.innerHTML=ch;
chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t;
  const i=CARDS.findIndex(x=> t==="welcome"?x.type==="welcome": t==="summary"?x.type==="summary":
    (t[0]==="s"&&t.length===2)?(x.type==="session"&&x.session===+t[1]): (x.block&&x.block.id===t)); go(i); });
function go(i){
  if(window.LIVE_STOP){ LIVE_STOP(); window.LIVE_STOP=null; }
  cur=Math.max(0,Math.min(CARDS.length-1,i)); const c=CARDS[cur];
  $("#stage").innerHTML=`<article class="card" id="card"></article>`;
  ctl=R[c.type]($("#card"),c)||{};
  const key=c.type==="welcome"?"welcome":c.type==="summary"?"summary":c.type==="session"?"s"+c.session:c.block.id;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===key));
  const on=chips.querySelector(".chip.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  if(c.block){ const inB=CARDS.filter(x=>x.block===c.block); $("#where").textContent=`Part ${c.session} · ${c.block.short} · ${c.label} · ${inB.indexOf(c)+1} of ${inB.length}`; }
  else $("#where").textContent=c.label;
  $("#prog").style.width=(cur/(CARDS.length-1)*100)+"%";
  $("#prevBtn").disabled=cur===0; $("#nextBtn").disabled=cur===CARDS.length-1;
  history.replaceState(null,"","#"+cur); window.scrollTo(0,0);
}
function next(){ if(ctl.advance&&ctl.advance()) return; if(cur<CARDS.length-1) go(cur+1); }
function prev(){ if(ctl.back&&ctl.back()) return; if(cur>0) go(cur-1); }
$("#nextBtn").onclick=()=>{ if(cur<CARDS.length-1) go(cur+1); };
$("#prevBtn").onclick=()=>{ if(cur>0) go(cur-1); };
document.addEventListener("keydown",ev=>{ if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ ev.preventDefault(); next(); }
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ ev.preventDefault(); prev(); } });
go(parseInt(location.hash.slice(1))||0);
</script>
